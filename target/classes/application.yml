spring:
  application:
    name: terrarent
  # Development Database Configuration (H2 in-memory by default, PostgreSQL overrides allowed)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:terrarentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update # Creates or updates tables on startup
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
    defer-datasource-initialization: true

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY:aSuperSecretKeyForTerraRentApplicationWhichIsLongEnoughForHS256Algorithm}
      access-token-expiration: 7200000 # 15 minutes (in milliseconds)
      refresh-token-expiration: 604800000 # 7 days (in milliseconds)

bookingcom:
  api:
    base-url: ${BOOKING_COM_BASE_URL:https://demandapi-sandbox.booking.com/3.1}
    affiliate-id: ${BOOKING_COM_AFFILIATE_ID:YOUR_AFFILIATE_ID}
    token: ${BOOKING_COM_TOKEN:YOUR_API_TOKEN}

server:
  port: 8081

logging:
  file:
    name: backend.log
  level:
    com.terrarent: DEBUG
    org.springframework.security: INFO